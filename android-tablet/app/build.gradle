plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kelabiqra.gesturelab'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kelabiqra.gesturelab'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir('generated/webAssets').get().asFile)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def repositoryRoot = rootProject.projectDir.parentFile
def generatedWebAssets = layout.buildDirectory.dir('generated/webAssets')

tasks.register('syncWebAssets', Sync) {
    from(new File(repositoryRoot, 'dist'))
    into(generatedWebAssets)
    doFirst {
        if (!new File(repositoryRoot, 'dist/index.html').isFile()) {
            throw new GradleException('Web build missing. Run android-tablet/build-apk.bat first.')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('syncWebAssets')
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
